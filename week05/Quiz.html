<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Code-along Activity: Quiz Form</title>
    <meta name="description"
      content="An online HTML and CSS quiz form created for WDD 130 Week 05 activity.">
    <meta name="author" content="Africaawhuu E'dahunsi">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>WDD 130: Web Fundamentals Quiz</h1>
    </header>

    <main>
        <form action="#" method="post">
            <!-- Question 1: Text Input -->
            <div class="form-item">
                <label for="q1">1. What does the acronym HTML stand for?</label>
                <input type="text" id="q1" name="q1" placeholder="Type your answer here..."
                  required>
            </div>

            <!-- Question 2: Textarea -->
            <div class="form-item">
                <label for="q2">2. Describe the main purpose of CSS in modern web
                    development:</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Explain the role of CSS..."
                  required></textarea>
            </div>

            <!-- Question 3: Select Element -->
            <div class="form-item">
                <label for="q3">3. Which CSS layout model is best designed for one-dimensional
                    layouts?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="flexbox">Flexbox</option>
                    <option value="grid">CSS Grid</option>
                    <option value="float">Float</option>
                </select>
            </div>

            <!-- Question 4: Number Input -->
            <div class="form-item">
                <label for="q4">4. How many heading levels are defined in HTML (h1 through
                    h?):</label>
                <input type="number" id="q4" name="q4" min="1" max="10" placeholder="e.g., 6"
                  required>
            </div>

            <!-- Submit Button -->
            <div class="form-item">
                <button type="submit">Submit Quiz</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Africaawhuu E'dahunsi | Lagos, Nigeria</p>
    </footer>
</body>

</html>
